name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security audit
        # The audit expects a .env file; create a throwaway CI-only one, then remove it
        # so the test suite runs with its own isolated settings.
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "MONGO_URI=mongodb://localhost:27017/baggy_ci"
            echo "ADMIN_EMAILS=ci@example.com"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env
          npm run audit
          rm -f .env

      - name: Tests
        run: npm test

      - name: Storefront render smoke
        run: npm run smoke
